name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check src tests examples

      - name: Tests (offline suite; live tests self-skip without a Profili install)
        run: uv run pytest tests/ -v
        env:
          PROFILI_SKIP_LIVE: "1"
