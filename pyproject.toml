[project]
name = "profili-mcp"
version = "0.1.0"
description = "MCP server for the legacy Profili 2.x airfoil software (Jet DB + bundled XFOIL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
]

[project.scripts]
profili-mcp = "profili_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "SIM", "RUF", "PLW", "S110"]
ignore = ["RUF002", "RUF003"]  # fullwidth punctuation is intentional in this bilingual project

[tool.ruff.lint.per-file-ignores]
# MCP tool wrappers intentionally catch everything and convert to a JSON error
# payload — a crashed tool must never take down the stdio server.
"src/profili_mcp/server.py" = ["BLE001", "PLW1510"]
# tests probe the environment and skip on any failure
"tests/*" = ["BLE001"]
# install probing intentionally swallows all errors (missing drivers, dirs, cache)
"src/profili_mcp/config.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
