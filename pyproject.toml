[project]
name = "profili-mcp"
version = "0.1.0"
description = "MCP server for the legacy Profili 2.x airfoil software (Jet DB + bundled XFOIL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
]

[project.scripts]
profili-mcp = "profili_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
